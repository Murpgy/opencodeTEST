name: fork-binaries

# Fork-only distributable builds. Upstream's publish.yml is pinned to
# Blacksmith runners AND gated on `github.repository == 'anomalyco/opencode'`,
# so it can never run here. This workflow builds the native opencode binary
# on free GitHub-hosted runners instead.
#
# Bun cross-compiles, but we build natively per OS (`--single`) so each
# runner smoke-tests its own binary (`<bin> --version`) before upload.
# No signing, no release upload, no electron — just usable binaries.
#
# Usage: Actions tab -> fork-binaries -> Run workflow (from v1.17.20-DBv2).
# Artifacts: opencode-linux-x64, opencode-windows-x64.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Baked client version: the fork's own dev version. If Console's free-tier
  # floor moves above the base here (it gates on `User-Agent:
  # opencode/<version>`), do NOT bump this — set OPENCODE_VERSION_OVERRIDE
  # in the environment where the binary runs instead (exported, so TUI,
  # serve, run, daemons and subprocesses all inherit it; see
  # installation/version.ts). The override wins when set; the baked value
  # is only the fallback.
  OPENCODE_VERSION: 1.17.20-dbv2.0

jobs:
  build:
    name: build (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-latest
            artifact: opencode-linux-x64
          - name: windows
            host: windows-latest
            artifact: opencode-windows-x64
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Installs dependencies too, with the Windows workarounds (Node 24 for
      # node-gyp, --linker hoisted so native install scripts resolve).
      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build native binary
        # --single keeps only the current OS/arch target (glibc on linux);
        # the script smoke-tests `<bin> --version` natively after compile.
        # --skip-install: Setup Bun above already did a full platform install
        # (with the Windows node-gyp/hoisted-linker workarounds). Letting
        # build.ts re-run `bun install --os="*" --cpu="*"` re-triggers the
        # tree-sitter-powershell postinstall in a bare context where
        # `bun x node-gyp` resolves to a broken path on windows-latest
        # (MODULE_NOT_FOUND). --single only needs the current platform's
        # natives, which are already in place, so skip the redundant install.
        run: ./packages/opencode/script/build.ts --single --skip-install

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.settings.artifact }}
          path: packages/opencode/dist/${{ matrix.settings.artifact }}
